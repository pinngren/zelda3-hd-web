<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1d4d38"/>
      <stop offset="60%" stop-color="#0f2b1f"/>
      <stop offset="100%" stop-color="#081510"/>
    </radialGradient>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4a3"/>
      <stop offset="45%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#b87b14"/>
    </linearGradient>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe77a"/>
      <stop offset="100%" stop-color="#9e620a"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="92" fill="none" stroke="#d4a73d" stroke-opacity="0.35" stroke-width="5"/>
  <g filter="url(#glow)">
    <!-- Top Triforce -->
    <polygon points="256,82 348,242 164,242" fill="url(#goldTop)" stroke="#fff4b8" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="256,104 328,230 256,204" fill="#fff7c2" fill-opacity="0.28"/>
    <!-- Bottom Left Triforce -->
    <polygon points="164,242 256,402 72,402" fill="url(#goldTop)" stroke="#fff4b8" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="164,264 236,390 164,364" fill="#fff7c2" fill-opacity="0.25"/>
    <!-- Bottom Right Triforce -->
    <polygon points="348,242 440,402 256,402" fill="url(#goldTop)" stroke="#fff4b8" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="348,264 420,390 348,364" fill="#fff7c2" fill-opacity="0.25"/>
  </g>
</svg>
